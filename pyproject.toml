[project]
name = "relational-compression"
version = "0.1.0"
description = "Reproducible experiments and paper artifacts for relational compression."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  { name = "Yaniv Shulman", email = "yaniv@shulman.info" },
]
dependencies = [
  "attrs>=23.0,<26.0",
  "compressai>=1.2.8,<2.0.0",
  "numpy>=1.26,<3.0",
  "pytorch-msssim>=1.0.0,<2.0.0",
  "scikit-learn>=1.5,<2.0",
  "scipy>=1.15,<2.0",
  "tensorboard>=2.18,<3.0",
  "torch>=2.4,<3.0",
  "torch-geometric>=2.8,<3.0",
  "torchvision>=0.19,<1.0",
  "tqdm>=4.66,<5.0",
]

[tool.poetry]
packages = [
  { include = "relational_compression", from = "src" },
]

[tool.poetry.group.dev.dependencies]
matplotlib = ">=3.10,<4.0"
networkx = ">=3.4,<4.0"
pytest = ">=8.0,<9.0"
pytest-cov = ">=5.0,<8.0"
ruff = ">=0.8,<1.0"
mypy = ">=1.11,<2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "--strict-config",
  "--strict-markers",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [
  "*.ipynb",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "D",
]
ignore = [
  "E501",
  "D203",
  "D213",
]

[tool.ruff.lint.isort]
known-first-party = ["relational_compression"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
